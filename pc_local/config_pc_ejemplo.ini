# Copiar como config_pc.ini (no se sube al repositorio) y completar la api_key

[nube]
url = https://utecnologica.org/estudiantes/imel/g06/api
# la misma API_KEY de nube/config.php
api_key = cambiar

[mqtt]
# Mosquitto corre en esta misma PC
host = localhost
port = 1883

[tiempos]
# subida de las ventanas a la nube (la consigna pide cada 10 min)
subida_s = 600
# consulta de comandos a la nube
polling_s = 30
# reenvio de un comando si el ESP8266 no lo confirma
reenvio_s = 60

[local]
base = datos_locales.db
